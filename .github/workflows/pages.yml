name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:   # the daily run calls this after it commits new data

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the latest commit, including data just committed by the daily run

      - uses: actions/configure-pages@v5

      - name: Collect site files
        run: |
          mkdir -p _site/data
          cp -r index.html browse.html market.html manifest.webmanifest sw.js assets icons _site/
          cp data/history.csv data/status.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
